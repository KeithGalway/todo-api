services:
  - type: web
    name: todo-api-legacy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: TODO_API_TOKEN
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
